<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>FitMetZorge | Gezamenlijke planreview</title><link rel="icon" href="../training-review-demo/brand.png"><link rel="stylesheet" href="demo.css"></head>
<body><header><img src="../training-review-demo/brand.png" alt="FitMetZorge"><div><strong>FitMetZorge</strong><span>6E-18 / Route B</span></div>
<nav><label>Language<select id="language"><option value="nl">Nederlands</option><option value="en">English</option><option value="de">Deutsch</option></select></label><label id="theme-label">Thema<select id="theme"><option value="light">Licht</option><option value="dark">Donker</option></select></label></nav></header>
<main><h1 id="title"></h1><p id="subtitle"></p><p class="notice" id="notice"></p>
<section aria-labelledby="tests-title"><h2 id="tests-title"></h2><button id="start" class="primary"></button><div id="scenario-buttons"></div></section>
<section id="review" aria-live="polite" tabindex="-1"><div class="stepbar"><button id="previous"></button><strong id="step"></strong><button id="next"></button></div><h2 id="scenario-title"></h2><p id="verdict"></p><dl id="review-details"></dl></section>
<section aria-labelledby="source-title"><h2 id="source-title"></h2><p id="source-caption"></p><div id="sources"></div></section>
<section aria-labelledby="proposal-title"><h2 id="proposal-title"></h2><p id="status"></p><p id="message" aria-live="polite"></p><div id="controls"></div><div id="plans" class="plan-grid"></div><div id="editors"></div></section>
<section><h2 id="history-title"></h2><div id="versions"></div><details><summary id="audit-title"></summary><ol id="audit"></ol></details></section>
<div class="bottom"><button id="source-change"></button><button id="revoke"></button><button id="reset"></button></div><p id="no-prediction"></p></main>
<script src="../coach-review-demo/catalog.js"></script><script src="../independent-intake-demo/data.js"></script>
<script src="../training-rules-demo/catalog.js"></script><script src="../training-rules-demo/model.js"></script><script src="../training-rules-demo/fixtures.js"></script>
<script src="../nutrition-rules-demo/catalog.js"></script><script src="../nutrition-rules-demo/model.js"></script><script src="../nutrition-rules-demo/fixtures.js"></script>
<script src="model.js"></script><script src="fixtures.js"></script><script src="copy.js"></script><script src="review.js"></script><script src="app.js"></script>
</body></html>
