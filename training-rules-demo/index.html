<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>FitMetZorge | 6E-16</title><link rel="icon" href="../training-review-demo/brand.png"><link rel="stylesheet" href="../bounded-adjustments-demo/demo.css"><link rel="stylesheet" href="demo.css">
<script defer src="../coach-review-demo/catalog.js"></script><script defer src="../independent-intake-demo/data.js"></script><script defer src="catalog.js"></script><script defer src="model.js"></script><script defer src="fixtures.js"></script><script defer src="copy.js"></script><script defer src="review.js"></script><script defer src="app.js"></script></head>
<body><header><img src="../training-review-demo/brand.png" alt="FitMetZorge"><div><strong>FitMetZorge</strong><span>6E-16 / Route B / Offline</span></div></header>
<main><h1 data-word="title"></h1><p class="banner" data-word="demo"></p>
<div class="toolbar"><label>NL / EN / DE<select id="language"><option value="nl">Nederlands</option><option value="en">English</option><option value="de">Deutsch</option></select></label><label id="theme-label">Thema<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label></div>
<section><h2 data-word="tests"></h2><p data-word="testNote"></p><button id="start" class="primary" data-word="start"></button><div id="scenario-buttons"></div>
<div id="review-result" tabindex="-1"><p id="step"></p><h3 id="scenario-title"></h3><p id="verdict" role="status" aria-live="polite"></p><h4 data-word="expected"></h4><p id="expectation"></p><p id="used"></p><div class="review-nav"><button id="previous" data-word="previous"></button><button id="next" data-word="next"></button></div><details><summary data-word="details"></summary><ul id="checks"></ul></details></div></section>
<section><details id="intake-details"><summary data-word="intake"></summary><form id="intake-form"><div id="intake"></div><button id="save" type="submit" data-word="save"></button></form></details><p id="catalog-line"></p><p id="feedback" role="status"></p><div id="actions" class="actions"></div></section>
<section><details><summary data-word="before"></summary><div id="before"></div></details></section>
<section><h2 data-word="draft"></h2><p id="blocked" class="banner" data-word="blocked" hidden></p><div id="proposal"></div></section>
<section><details><summary data-word="oldActive"></summary><div id="active"></div></details></section>
<section><h2 data-word="versions"></h2><p id="versions"></p><details><summary data-word="audit"></summary><ol id="audit"></ol></details></section>
<section><div id="simulations" class="actions"></div><p data-word="scope"></p></section></main></body></html>
