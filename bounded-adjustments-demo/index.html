<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>FitMetZorge | 6E-14</title><link rel="icon" href="../training-review-demo/brand.png"><link rel="stylesheet" href="demo.css">
<script defer src="../coach-review-demo/catalog.js"></script><script defer src="../coach-review-demo/model.js"></script>
<script defer src="copy.js"></script><script defer src="data.js"></script><script defer src="model.js"></script><script defer src="app.js"></script></head>
<body><header><img src="../training-review-demo/brand.png" alt="FitMetZorge"><div><strong>FitMetZorge</strong><span>6E-14 / Offline</span></div></header>
<main><h1 id="title"></h1><p id="demo" class="banner"></p>
<div class="toolbar"><label><span data-copy="scenario"></span><select id="scenario"></select></label><label><span data-copy="language"></span><select id="language"><option value="nl">Nederlands</option><option value="en">English</option><option value="de">Deutsch</option></select></label><label><span data-copy="theme"></span><select id="theme"><option value="light">Licht</option><option value="dark">Donker</option></select></label><label id="actor-label"><span data-copy="actor"></span><select id="actor"></select></label></div>
<section class="summary"><h2 id="status" aria-live="polite"></h2><ol id="steps" class="steps"></ol><div id="message"></div><p id="feedback"></p><p id="result" role="status"></p><div id="actions" class="actions"></div></section>
<section><h2 data-copy="facts"></h2><div id="facts" class="facts"></div><p id="access"></p></section>
<section class="plans"><div><h2 data-copy="before"></h2><div id="before"></div></div><div><h2 data-copy="after"></h2><div id="after"></div></div></section>
<section id="edit-section"><h2 data-copy="edit"></h2><form id="edit-form"><fieldset><legend data-copy="days"></legend><div id="days" class="days"></div></fieldset><div class="toolbar"><label><span data-copy="favorite"></span><select id="favorite"></select></label><label><span data-copy="avoid"></span><select id="avoid"></select></label><label><span data-copy="exercise"></span><select id="exercise"></select></label></div><button type="submit" data-copy="edit"></button></form></section>
<section><details><summary data-copy="sources"></summary><div id="changes"></div><pre id="sources"></pre></details></section>
<section><h2 data-copy="history"></h2><p id="versions"></p><ol id="audit"></ol><p id="rollback"></p></section>
<section class="controls"><div id="simulations" class="actions"></div><p id="scope"></p></section>
</main></body></html>
