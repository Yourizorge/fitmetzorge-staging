name: 6E-11 temporary server admission
run-name: "6E-11 server admission ${{ inputs.receipt }}"
on:
  workflow_dispatch:
    inputs:
      receipt:
        description: Unique evidence label; no secrets
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: phase6e11-server-admission
  cancel-in-progress: false
jobs:
  admission:
    if: github.repository == 'Yourizorge/fitmetzorge-staging' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: One read-only server admission, no automatic retry
        run: python3 _offline/phase6e11/request_v4/proof_client.py
