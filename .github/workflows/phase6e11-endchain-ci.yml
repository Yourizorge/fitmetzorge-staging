name: 6E-11 one-run budget and adapter CI
run-name: "6E-11 endchain CI ${{ inputs.candidate_sha256 }}"
on:
  workflow_dispatch:
    inputs:
      candidate_blob:
        required: true
        type: string
      candidate_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: phase6e11-controller-ci
  cancel-in-progress: false
jobs:
  isolated-endchain:
    if: github.repository == 'Yourizorge/fitmetzorge-staging' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Clean 44-migration candidate and component regressions
        env:
          CANDIDATE_BLOB: ${{ inputs.candidate_blob }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 _offline/phase6e11/endchain_v1/ci.py
      - name: Preserve source-bound synthetic evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fmz-db41-evidence"
          manifest = {}
          for file in sorted(root.glob("*")):
              if file.is_file() and file.suffix in (".json", ".txt"):
                  data = file.read_bytes()
                  if len(data) > 2000000: raise SystemExit("evidence_limit")
                  manifest[file.name] = hashlib.sha256(data).hexdigest()
          with (root / "artifact-manifest.json").open("x") as out:
              json.dump(manifest, out, sort_keys=True)
          print(json.dumps({"files": len(manifest), "manifest_sha256": hashlib.sha256((root / "artifact-manifest.json").read_bytes()).hexdigest()}))
          PY
      - name: Preserve evidence bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6e11-endchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fmz-db41-evidence/*.json
            ${{ runner.temp }}/fmz-db41-evidence/*.txt
          retention-days: 1
          if-no-files-found: error
