<!doctype html>
<html lang="nl" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer"><title>FitMetZorge - Workoutreflectie 6E-12</title>
<link rel="stylesheet" href="demo.css">
<script defer src="../training-review-demo/model.js"></script><script defer src="memory.js"></script>
<script defer src="data.js"></script><script defer src="copy.js"></script><script defer src="app.js"></script>
</head><body>
<div class="scope" id="scope"></div>
<header><img src="../training-review-demo/brand.png" alt="FitMetZorge" width="42" height="42"><div><strong>FitMetZorge</strong><span id="package">6E-12</span></div>
<div class="preferences"><label><span id="language-label"></span><select id="language"><option value="nl">NL</option><option value="en">EN</option><option value="de">DE</option></select></label>
<label><span id="theme-label"></span><select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label></div></header>
<main>
<div class="heading"><div><p class="eyebrow" id="demo-label"></p><h1 id="title"></h1></div><button id="reset"></button></div>
<p id="reset-note" class="notice"></p>
<div class="toolbar"><label><span id="scenario-label"></span><select id="scenario"></select></label><label><span id="role-label"></span><select id="role"><option value="member"></option><option value="trainer"></option></select></label></div>
<div class="steps" id="steps"></div>
<div class="workspace">
<section class="registration"><div class="section-title"><h2 id="registration-title"></h2><span class="badge" id="reg-version"></span></div>
<div class="source-note" id="snapshot"></div><div id="sets"></div>
<div class="actions"><button class="primary" id="register"></button><button id="reflect"></button></div>
<p class="notice" id="example-limit"></p><p id="feedback" role="status" aria-live="polite"></p>
<details><summary id="registration-history-title"></summary><div id="registration-history"></div></details>
</section>
<section class="review"><div class="section-title"><h2 id="review-title"></h2><span class="badge" id="plan-version"></span></div>
<div id="empty"></div><div id="status" role="status"></div><div id="comparison"></div><div id="actions" class="actions"></div>
<details id="reason-detail"><summary id="reason-title"></summary><div id="reasons"></div></details>
<div class="source-control"><label><span id="event-label"></span><select id="source-event"></select></label><button id="inject"></button></div>
<h3 id="history-title"></h3><div id="history"></div><h3 id="audit-title"></h3><ol id="audit"></ol>
</section></div>
<footer id="footer"></footer>
</main></body></html>
